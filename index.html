<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train your brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>Train your brain</h1>
  <p>Genera, stampa e allena la tua mente giocando — da un papà qualunque, con tanto amore 💛</p>
</div>

<div class="controls">
  <div class="controls-row controls-types">
    <button class="btn btn-type active" onclick="setType('maze',this)">🌀 Labirinto</button>
    <button class="btn btn-type" onclick="setType('words',this)">🔤 Cerca parole</button>
    <button class="btn btn-type" onclick="setType('sudoku',this)">🔢 Sudoku</button>
    <button class="btn btn-type" onclick="setType('sudokujunior',this)">🐶 Sudoku Junior</button>
    <button class="btn btn-type" onclick="setType('color',this)">🎨 Colora!</button>
    <button class="btn btn-type" onclick="setType('pregraf',this)">✏️ Pregrafismo</button>
    <button class="btn btn-type" onclick="setType('picross',this)">🔲 Disegna con i numeri</button>
    <button class="btn btn-type" onclick="setType('count',this)">👀 Punta e conta</button>
    <button class="btn btn-type" onclick="setType('sequence',this)">🧠 Sequenza</button>
    <button class="btn btn-type" onclick="setType('path',this)">🧭 Percorso guidato</button>
    <button class="btn btn-type" onclick="setType('cancel',this)">🎯 Cancellazione</button>
    <button class="btn btn-type" onclick="setType('rule',this)">🧩 Trova la regola</button>
    <button class="btn btn-type" onclick="setType('mirror',this)">🪞 Riflesso</button>
    <button class="btn btn-type" onclick="setType('pairs',this)">🃏 Coppie</button>
    <button class="btn btn-type" onclick="setType('oddone',this)">🔍 Intruso</button>
    <button class="btn btn-type" onclick="setType('diff',this)">🖼️ Trova le differenze</button>
    <button class="btn btn-type" onclick="setType('calc',this)">🧮 Calcolo</button>
    <button class="btn btn-type" onclick="setType('tables',this)">✖️ Tabelline</button>
    <button class="btn btn-type" onclick="setType('anagram',this)">🔀 Anagrammi</button>
    <button class="btn btn-type" onclick="setType('missingletter',this)">🔡 Lettera mancante</button>
    <button class="btn btn-type" onclick="setType('synant',this)">🔗 Sinonimi e Contrari</button>
    <button class="btn btn-type" onclick="setType('sentence',this)">📝 Ordina la frase</button>
    <button class="btn btn-type" onclick="setType('vocaben',this)">🇬🇧 Vocabolario IT-EN</button>
    <button class="btn btn-type" onclick="setType('anagramen',this)">🔠 Anagrammi in inglese</button>
    <button class="btn btn-type" onclick="setType('missingletteren',this)">🅰️ Lettera mancante EN</button>
    <button class="btn btn-type" onclick="setType('frasien',this)">💬 Frasi da completare IT-EN</button>
  </div>

  <div class="controls-row controls-meta">
    <input type="text" id="nameInput" placeholder="Nome del bambino..." maxlength="20">
    <span class="diff-label">Età:</span>
    <select id="difficulty">
      <option value="explorer">🌱 3–5 anni</option>
      <option value="curious" selected>🌟 6–8 anni</option>
      <option value="growing">🚀 9–11 anni</option>
      <option value="challenge">🧠 12+ anni</option>
    </select>
  </div>

  <div class="controls-row controls-actions">
    <button class="btn btn-gen" onclick="generate()">✨ Genera!</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Stampa</button>
  </div>
</div>

<div class="puzzle-area" id="puzzleArea">
  <div class="empty-state">
    <div class="emoji">🎮</div>
    <p>Scegli un puzzle e premi "Genera!"</p>
    <small>Poi stampa con un clic 🖨️</small>
  </div>
</div>

<script src="puzzle.js"></script>
</body>
</html>
